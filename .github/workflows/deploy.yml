name: GitHub Pages Deployment

on:
  push:
    branches:
      - main

# GitHub Pages deploy için gerekli izinler
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Kod havuzunu klonla
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Projeyi derle (build)
        run: npm run build

      - name: GitHub Pages'e deploy et
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: yamactan.github.io
